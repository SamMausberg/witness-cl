[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-cl"
version = "0.8.0"
description = "Experience-derived SQL abstractions with typed compilation and explicit empirical limits"
requires-python = ">=3.11"
authors = [{name = "Samuel Mausberg"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "scipy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
