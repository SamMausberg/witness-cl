[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-cl"
version = "0.10.0"
description = "Auditable online executable memory with exact evidence, bounded repair, and Lean contracts"
requires-python = ">=3.11"
authors = [{name = "Samuel Mausberg"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24,<3",
    "sqlglot==30.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "scipy>=1.10,<2"]
dev = ["ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witness_cl = ["_vendor/ace/LICENSE.txt", "_vendor/ace/PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
