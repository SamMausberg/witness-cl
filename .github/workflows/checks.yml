name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,analysis]'
      - run: make test
      - run: make cpp-check
      - name: Replay frozen v8 evidence and regenerate descriptive tables
        run: |
          PYTHONPATH=src python experiments/audit_sql_abstractions_v8.py artifacts/v8/development --freeze artifacts/v8/prepilot-freeze.json --output artifacts/v8/development-replay.json
          python tools/v8_results.py
      - name: Replay v9 solver diagnostics
        run: PYTHONPATH=src python experiments/audit_competence_v9.py artifacts/v9/diagnostics/*/ --output artifacts/v9/diagnostics/replay-all.json
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official elan launcher
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make formal
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pgasawa/continual-learning-bench
          ref: 5f8c50eb1e84b2eda2ef4faff757dfc812a0ea26
          path: upstream-clbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r integrations/clbench/requirements-native.lock
      - name: Check actual pinned upstream interface and runner
        env:
          WITNESS_CLBENCH_UPSTREAM: ${{ github.workspace }}/upstream-clbench
        run: python -m pytest tests/test_clbench_core.py tests/test_clbench_native.py -q
