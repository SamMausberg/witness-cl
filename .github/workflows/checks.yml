name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.12
      - run: uv sync --locked --python '${{ matrix.python-version }}' --extra test --extra analysis --extra dev
      - run: make test PYTHON=.venv/bin/python
      - run: make lint
      - run: make cpp-check PYTHON=.venv/bin/python
      - name: Replay historical evidence at its exact source revision
        run: make legacy-audit PYTHON=.venv/bin/python
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official elan launcher
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make formal
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - run: make paper
      - run: make technical-report
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pgasawa/continual-learning-bench
          ref: 5f8c50eb1e84b2eda2ef4faff757dfc812a0ea26
          path: upstream-clbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r integrations/clbench/requirements-native.lock
      - name: Check actual pinned upstream interface and runner
        env:
          WITNESS_CLBENCH_UPSTREAM: ${{ github.workspace }}/upstream-clbench
        run: python -m pytest tests/test_clbench_core.py tests/test_clbench_native.py tests/test_native_learning.py tests/test_native_campaign.py -q
